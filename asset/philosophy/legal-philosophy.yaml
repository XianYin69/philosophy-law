    - by: 科尔曼（《理性的边界》1996）与温里布（《私法的性观念》？）
      claim: 效率分析预设了它应当解释的私法结构（具体文献待核）
    - by: 行为法律经济学（桑斯坦等）
      claim: 理性人假设与完全信息前提被经验研究削弱
  refs:
