    原则作为"最优化命令"以权重关系与碰撞法则处理
  school: 商谈理论／非实证主义
  criticism:
    - by: 拉兹与沃尔德伦
      claim: 正确性主张是概念上的过度要求，可能把法的效力系于道德成功
    - by: 哈贝马斯（与阿列克西关于法律与道德关系的分歧，1986/1990 年代）
      claim: 法律论证不能还原为普遍实践论证，法的"事实性"须被承认
  refs:
    - tier: T3
      citation: A Theory of Legal Argumentation（Oxford, 1995）
      url_status: unchecked
  verified: partial
- id: phil.legal.humanrights
  title: 人权哲学与惩罚理论
