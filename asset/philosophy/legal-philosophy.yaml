- id: phil.legal.alexy
  title: 阿列克西：论证理论与正确性主张
  domain: philosophy
  text: 《法律论证理论》（1978，1995 年英译；普遍实践论证与特殊法律论证、
    内部证成与外部证成）、《法概念与法效力》（1997，2002 年英译）、
    《权利的理念》（1995？待核）、比例原则三阶（适当性、必要性、狭义均衡）
  thesis: 法律必然主张正确性（Richtigkeit），故非实证主义：极端不正义的规范
